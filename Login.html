<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SD Empire - Affiliate Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#070707;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    width:90%;
    max-width:420px;
    background:#111;
    padding:30px;
    border-radius:18px;
    border:1px solid #252525;
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:900;
    margin-bottom:25px;
}

.orange{
    color:#ff7f00;
}

h2{
    text-align:center;
    color:#ff7f00;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    margin:7px 0;
    background:#080808;
    border:1px solid #333;
    border-radius:9px;
    color:white;
    font-size:16px;
}

.continue-btn{
    width:100%;
    padding:14px;
    margin-top:12px;
    background:#ff7f00;
    color:white;
    border:0;
    border-radius:9px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.message{
    text-align:center;
    margin-top:15px;
    color:#ff7f00;
}

.home{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#999;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        SD <span class="orange">EMPIRE</span>
    </div>

    <h2>Affiliate Login</h2>

    <input
        type="email"
        id="email"
        placeholder="Email Address"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button
        class="continue-btn"
        onclick="login()">
        Continue
    </button>

    <p class="message" id="message"></p>

    <a href="index.html" class="home">
        ← Back to Home
    </a>

</div>

<script>

function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value.trim();

    if(email === "" || password === ""){

        document.getElementById("message").innerText =
        "Please enter email and password.";

        return;
    }

    localStorage.setItem(
        "sdEmpireLoggedIn",
        "true"
    );

    localStorage.setItem(
        "sdEmpireEmail",
        email
    );

    window.location.href =
        "dashboard.html";
}

</script>

</body>
  </html>
