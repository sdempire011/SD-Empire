<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SD Empire | Login</title>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
:root{
 --orange:#FF7F00;
 --dark:#160044;
}
*{box-sizing:border-box;margin:0;padding:0}

body{
 font-family:Arial,sans-serif;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 background:linear-gradient(135deg,#160044,#351080);
 padding:20px;
}

.box{
 width:100%;
 max-width:430px;
 background:#fff;
 border-radius:22px;
 padding:35px;
 box-shadow:0 20px 50px #0005;
}

.logo{
 text-align:center;
 font-size:28px;
 font-weight:900;
 color:var(--dark);
 margin-bottom:8px;
}

.logo span{color:var(--orange)}

h2{
 text-align:center;
 margin:10px 0;
 color:#222;
}

.subtitle{
 text-align:center;
 color:#777;
 font-size:14px;
 margin-bottom:25px;
}

label{
 display:block;
 font-size:14px;
 font-weight:bold;
 margin:15px 0 7px;
}

input{
 width:100%;
 padding:14px;
 border:1px solid #ddd;
 border-radius:9px;
 outline:none;
}

input:focus{
 border-color:var(--orange);
}

button{
 width:100%;
 padding:14px;
 margin-top:22px;
 border:0;
 border-radius:25px;
 background:var(--orange);
 color:white;
 font-weight:bold;
 cursor:pointer;
 font-size:15px;
}

.switch{
 text-align:center;
 margin-top:20px;
 font-size:14px;
 color:#777;
}

.switch a{
 color:var(--orange);
 font-weight:bold;
}

.back{
 display:block;
 text-align:center;
 margin-top:18px;
 color:var(--dark);
 font-size:14px;
}

.message{
 text-align:center;
 margin-top:12px;
 color:var(--orange);
 font-size:14px;
}

.course-selected{
 background:#fff3e6;
 padding:10px;
 border-radius:8px;
 text-align:center;
 font-size:13px;
 margin-bottom:15px;
 color:#9a5c00;
}
</style>
</head>

<body>

<div class="box">

<div class="logo">SD <span>EMPIRE</span></div>

<h2 id="title">Welcome Back</h2>

<p class="subtitle" id="subtitle">
Login to access your SD Empire dashboard.
</p>

<div id="selected"
class="course-selected"
style="display:none">
</div>

<form id="authForm">

<div id="nameField" style="display:none">

<label>Full Name</label>
<input
type="text"
id="name"
placeholder="Enter your full name">
</div>

<div id="phoneField" style="display:none">

<label>Phone Number</label>
<input
type="tel"
id="phone"
placeholder="Enter your phone number">
</div>

<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required>

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter password"
required>

<button type="submit" id="submitBtn">
Login
</button>

</form>

<div class="switch">
<span id="switchText">
Don't have an account?
</span>

<a href="#" onclick="toggleMode()">
Sign Up
</a>
</div>

<div class="message" id="message"></div>

<a href="index.html" class="back">
← Back to Home
</a>

</div>


<script>

/* =========================
   EMAILJS
========================= */

emailjs.init({
 publicKey: "gass9ReoapaS8b-Gg"
});


let signup = false;


/* =========================
   COURSE
========================= */

const params =
new URLSearchParams(location.search);

const selectedCourse =
params.get("course");

if(selectedCourse){

 document.getElementById("selected").style.display =
 "block";

 document.getElementById("selected").innerText =
 "Selected Course: " + selectedCourse;

 localStorage.setItem(
 "selectedCourse",
 selectedCourse
 );

}


/* =========================
   TOGGLE SIGNUP / LOGIN
========================= */

function toggleMode(){

 signup = !signup;

 document.getElementById("nameField").style.display =
 signup ? "block" : "none";

 document.getElementById("phoneField").style.display =
 signup ? "block" : "none";


 document.getElementById("title").innerText =
 signup
 ? "Create Account"
 : "Welcome Back";


 document.getElementById("subtitle").innerText =
 signup
 ? "Create your SD Empire account."
 : "Login to access your dashboard.";


 document.getElementById("submitBtn").innerText =
 signup
 ? "Create Account"
 : "Login";


 document.getElementById("switchText").innerText =
 signup
 ? "Already have an account?"
 : "Don't have an account?";


 document.querySelector(".switch a").innerText =
 signup
 ? " Login"
 : " Sign Up";

}


/* =========================
   FORM SUBMIT
========================= */

document
.getElementById("authForm")
.addEventListener("submit", async function(e){

 e.preventDefault();


 const name =
 document.getElementById("name").value.trim();


 const phone =
 document.getElementById("phone").value.trim();


 const email =
 document.getElementById("email").value.trim();


 const password =
 document.getElementById("password").value;


 /* =========================
    SIGN UP / ENROLLMENT
 ========================= */

 if(signup){

   if(!name){

     show("Please enter your name.");

     return;
   }


   if(!phone){

     show("Please enter your phone number.");

     return;
   }


   const course =
   selectedCourse ||
   localStorage.getItem("selectedCourse") ||
   "Not selected";


   const user = {

     name:name,

     email:email,

     phone:phone,

     password:password,

     course:course

   };


   localStorage.setItem(
   "sdEmpireUser",
   JSON.stringify(user)
   );


   show("Sending enrollment details...");


   try{

     const templateParams = {

       name: name,

       email: email,

       phone: phone,

       course: course,

       payment_status: "Pending",

       message:
       "New student enrolled on SD Empire."


     };


     await emailjs.send(

       "service_1ben2mg",

       "template_ybr7ub",

       templateParams

     );


     show(
     "Enrollment successful! Details sent to SD Empire."
     );


   }catch(error){

     console.error(
     "EmailJS Error:",
     error
     );


     show(
     "Account created, but email sending failed."
     );

   }


   setTimeout(function(){

     location.href =
     "dashboard.html";

   },1500);


 }


 /* =========================
    LOGIN
 ========================= */

 else{

   const saved =
   localStorage.getItem("sdEmpireUser");


   if(!saved){

     show(
     "Account not found. Please Sign Up first."
     );

     return;

   }


   const user =
   JSON.parse(saved);


   if(
   user.email === email &&
   user.password === password
   ){

     localStorage.setItem(
     "sdEmpireLoggedIn",
     "true"
     );


     location.href =
     "dashboard.html";

   }

   else{

     show(
     "Incorrect email or password."
     );

   }

 }

});


/* =========================
   MESSAGE
========================= */

function show(text){

 document.getElementById("message").innerText =
 text;

}

</script>

</body>
 </html>
